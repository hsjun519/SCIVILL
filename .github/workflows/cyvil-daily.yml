name: SCIVILL daily competition collection
on:
  schedule:
    # 23:00 UTC = next day 08:00 Asia/Seoul. GitHub may delay runs.
    - cron: '0 23 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'collector/**'
      - 'tests/**'
      - '.github/workflows/cyvil-daily.yml'
permissions:
  contents: read
  id-token: write
concurrency:
  group: cyvil-competition-database
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test eligibility, KST deadlines, deduplication and security
        run: python -m unittest discover -s tests -v
      - name: Collect official notices and save privately without AI
        run: python -m collector.remote_client
