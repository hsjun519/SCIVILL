<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F2F4F6">
  <meta name="description" content="싸이빌 부원을 위한 대회 정보, 팀 모집, 프로젝트 관리.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="SCIVILL">
  <meta property="og:title" content="SCIVILL · 싸이빌 플랫폼">

  <meta property="og:url" content="https://hsjun519.github.io/SCIVILL/platform/">
  <title>SCIVILL</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230A7D69'/%3E%3Cpath d='M43 20H27a8 8 0 000 16h10a8 8 0 010 16H20' transform='translate(0 -4)' fill='none' stroke='white' stroke-width='7' stroke-linecap='round'/%3E%3C/svg%3E">
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem('scivill.theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="app.css?v=3">
  <script src="app.js?v=3" defer></script>
</head>
<body>
  <a class="skip-link" href="#main" data-act="skip">본문으로 건너뛰기</a>
  <div class="app">
    <aside class="side" aria-label="주 메뉴">
      <a class="logo" href="#home" aria-label="SCIVILL 홈">
        <span class="logo-mark" aria-hidden="true">S</span>
        <span class="logo-text">SCIVILL</span>
      </a>
      <nav class="side-nav" id="side-nav"></nav>
      <div class="side-foot" id="side-foot"></div>
    </aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main id="main" class="page" tabindex="-1"></main>
    </div>
  </div>
  <nav class="tabbar" id="tabbar" aria-label="하단 메뉴"></nav>
  <dialog id="sheet" class="sheet" aria-labelledby="sheet-title"><div class="sheet-body" id="sheet-body"></div></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
